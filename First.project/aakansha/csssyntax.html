<!DOCTYPE html>
<html lang="en">
<head>

 <style>

  * {
    margin: 0;
    padding: 0;
  }
   .container {
    height: 70vh;
    width: 70vh;
     display: flex;
   justify-content: center;
   align-items: center;
   }
        .game {
   height: 60vmin;
   width: 60vmin;
   display: flex;
   flex-wrap: wrap;
   justify-content: center;
   align-items: center;
   gap: 1.5vmin;
  
}

.box {
  height: 8vmin;
  width: 80vmin;
  border-radius: 1rem;
  border: none;
  box-shadow: 0 0 1rem rgba(0, 0, 0, 0.3);
  font-size: 5vmin;
  color:#EFA8B8 ;
  align-items: center;
}
 
#button{
    height: 20rem;
    width: 20rem;
    align-items: center;
    border: 1rem;
}

h1 {
    text-align: center;
   

}

body {
    text-align: center ;
   
}

</style>
   
<body>
    <main>
    <h1>aakansha</h1>
    <div class="container">
    <div class="game">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    </div>
    </div>
    <button id="reset button">Reset Btn</button>
    </main>

    
</body>
